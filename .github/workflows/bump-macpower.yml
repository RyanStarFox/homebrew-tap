name: Bump MacPower cask

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update cask from the latest release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import urllib.request

          cask_path = "Casks/macpower.rb"
          with urllib.request.urlopen("https://api.github.com/repos/RyanStarFox/MacPower/releases/latest") as response:
              release = json.load(response)
          tag = release["tag_name"]
          version = tag.removeprefix("v")
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"unexpected version tag: {tag}")
          asset_name = f"MacPower-{version}.dmg"
          asset = next(item for item in release["assets"] if item["name"] == asset_name)
          print(f"latest {tag} {asset['browser_download_url']}")

          cask = open(cask_path, encoding="utf-8").read()
          current = re.search(r'^  version "([^"]+)"', cask, re.M).group(1)
          if current == version:
              print(f"cask already at {version}")
              open("/tmp/macpower-cask-changed", "w").write("0")
              raise SystemExit

          digest = hashlib.sha256()
          with urllib.request.urlopen(asset["browser_download_url"]) as response:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  digest.update(chunk)
          sha = digest.hexdigest()
          updated = re.sub(r'^  version ".*"', f'  version "{version}"', cask, count=1, flags=re.M)
          updated = re.sub(r'^  sha256 ".*"', f'  sha256 "{sha}"', updated, count=1, flags=re.M)
          open(cask_path, "w", encoding="utf-8").write(updated)
          open("/tmp/macpower-cask-changed", "w").write("1")
          print(f"bumped {current} -> {version} {sha}")
          PY

      - name: Commit cask
        run: |
          if [ "$(cat /tmp/macpower-cask-changed)" != "1" ]; then
            exit 0
          fi
          git config user.name "ryanstarfox-tap"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/macpower.rb
          git commit -m "Update MacPower cask to the latest release."
          git push
